    const { useState, useEffect, useRef } = React;

    // ── SCHEDULE DATA ──────────────────────────────────────────────
    const SCHEDULE = {
      0: null,
      1: { open: 9, close: 16 },
      2: { open: 9, close: 20 },
      3: { open: 9, close: 20 },
      4: { open: 9, close: 20 },
      5: { open: 9, close: 20 },
      6: { open: 10, close: 18 },
    };
    const DAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

    function getAvailableSlots(date) {
      const day = date.getDay();
      const hours = SCHEDULE[day];
      if (!hours) return [];
      const slots = [];
      for (let h = hours.open; h < hours.close; h++) {
        slots.push(`${h.toString().padStart(2,'0')}:00`);
        if (h + 0.5 < hours.close) slots.push(`${h.toString().padStart(2,'0')}:30`);
      }
      return slots;
    }

        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);

    function Turnos({ tweaks }) {

        date: '',
        time: '',
        name: '',
        phone: '',
        notes: '',

      const dayInfo = getTodayDayInfo();

                    width: 32, height: 32,

                    fontSize: 13, fontWeight: 500,
                    transition: 'all 0.3s',
                    borderRadius: '50%',
                  }}>{s}</div>
                  <span style={{
                    fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase',
                    color: step >= s ? tweaks.accentColor : `${tweaks.bgColor}40`,
                  }}>
                    {s === 1 ? 'Servicio' : s === 2 ? 'Horario' : 'Confirmar'}
                  </span>
                  {s < 3 && (
                    <div style={{
                      position: 'absolute', display: 'none',
                    }}></div>
                  )}
                </div>
              ))}
            </div>

            <div style={{
              background: `${tweaks.bgColor}08`,
              border: `1px solid ${tweaks.bgColor}15`,
              padding: '40px',
            }}>

              {/* STEP 1 */}
              {step === 1 && (
                <div>
                  <h3 style={{
                    fontFamily: tweaks.headingFont, fontSize: 24, fontWeight: 400,
                    color: tweaks.bgColor, marginBottom: 28,
                  }}>¿Qué servicio buscás?</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {services.map(s => (
                      <button key={s} onClick={() => setForm(f => ({ ...f, service: s }))}
                        style={{
                          padding: '16px 20px', textAlign: 'left',
                          background: form.service === s ? tweaks.accentColor : 'transparent',
                          border: `1px solid ${form.service === s ? tweaks.accentColor : tweaks.bgColor + '25'}`,
                          color: form.service === s ? tweaks.navyColor : tweaks.bgColor,
                          fontSize: 14, cursor: 'pointer',
                          fontFamily: 'DM Sans, sans-serif',
                          transition: 'all 0.2s',
                        }}>{s}</button>
                    ))}
                  </div>
                  <div style={{ marginTop: 32, display: 'flex', justifyContent: 'flex-end' }}>
                    <button onClick={() => form.service && setStep(2)}
                      disabled={!form.service}
                      style={{
                        padding: '14px 36px', background: tweaks.accentColor,
                        color: tweaks.navyColor, border: 'none', fontSize: 13,
                        letterSpacing: '0.1em', textTransform: 'uppercase',
                        cursor: form.service ? 'pointer' : 'not-allowed',
                        opacity: form.service ? 1 : 0.4,
                        fontFamily: 'DM Sans, sans-serif', fontWeight: 500,
                      }}>Continuar →</button>
                  </div>
                </div>
              )}

              {/* STEP 2 */}
              {step === 2 && (
                <div>
                  <h3 style={{
                    fontFamily: tweaks.headingFont, fontSize: 24, fontWeight: 400,
                    color: tweaks.bgColor, marginBottom: 28,
                  }}>¿Cuándo querés venir?</h3>

                  <div style={{ marginBottom: 24 }}>
                    <label style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, display: 'block', marginBottom: 10 }}>Fecha</label>
                    <input type="date" min={today}
                      value={form.date}
                      onChange={e => setForm(f => ({ ...f, date: e.target.value }))}
                      style={{ ...inputStyle, colorScheme: 'dark' }}
                      onFocus={e => e.target.style.borderColor = tweaks.accentColor}
                      onBlur={e => e.target.style.borderColor = `${tweaks.navyColor}30`}
                    />
                    {dayInfo && (
                      <p style={{
                        fontSize: 12, marginTop: 8,
                        color: dayInfo.closed ? '#ff8a8a' : tweaks.accentColor,
                        opacity: 0.8,
                      }}>
                        {dayInfo.closed
                          ? `${dayInfo.name}: cerrado`
                          : `${dayInfo.name}: ${dayInfo.open}:00 — ${dayInfo.close}:00 hs`}
                      </p>
                    )}
                  </div>

                  {availableSlots.length > 0 && (
                    <div style={{ marginBottom: 24 }}>
                      <label style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, display: 'block', marginBottom: 10 }}>Horario preferido</label>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
                        {availableSlots.map(slot => (
                          <button key={slot} onClick={() => setForm(f => ({ ...f, time: slot }))}
                            style={{
                              padding: '10px 4px', textAlign: 'center',
                              background: form.time === slot ? tweaks.accentColor : 'transparent',
                              border: `1px solid ${form.time === slot ? tweaks.accentColor : tweaks.bgColor + '25'}`,
                              color: form.time === slot ? tweaks.navyColor : tweaks.bgColor,
                              fontSize: 13, cursor: 'pointer',
                              fontFamily: 'DM Sans, sans-serif',
                              transition: 'all 0.15s',
                            }}>{slot}</button>
                        ))}
                      </div>
                    </div>
                  )}

                  {form.date && dayInfo?.closed && (
                    <p style={{ color: '#ff8a8a', fontSize: 14, textAlign: 'center', padding: '20px 0' }}>
                      No atendemos los domingos. Por favor elegí otro día.
                    </p>
                  )}

                  <div style={{ marginTop: 32, display: 'flex', justifyContent: 'space-between' }}>
                    <button onClick={() => setStep(1)} style={{
                      padding: '14px 28px', background: 'transparent',
                      border: `1px solid ${tweaks.bgColor}30`,
                      color: tweaks.bgColor, fontSize: 13,
                      letterSpacing: '0.08em', textTransform: 'uppercase',
                      cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
                    }}>← Volver</button>
                    <button onClick={() => form.date && form.time && setStep(3)}
                      disabled={!form.date || !form.time}
                      style={{
                        padding: '14px 36px', background: tweaks.accentColor,
                        color: tweaks.navyColor, border: 'none', fontSize: 13,
                        letterSpacing: '0.1em', textTransform: 'uppercase',
                        cursor: (form.date && form.time) ? 'pointer' : 'not-allowed',
                        opacity: (form.date && form.time) ? 1 : 0.4,
                        fontFamily: 'DM Sans, sans-serif', fontWeight: 500,
                      }}>Continuar →</button>
                  </div>
                </div>
              )}

              {/* STEP 3 */}
              {step === 3 && (
                <div>
                  <h3 style={{
                    fontFamily: tweaks.headingFont, fontSize: 24, fontWeight: 400,
                    color: tweaks.bgColor, marginBottom: 28,
                  }}>Tus datos</h3>

                  {/* Summary */}
                  <div style={{
                    background: `${tweaks.accentColor}15`,
                    border: `1px solid ${tweaks.accentColor}30`,
                    padding: '16px 20px', marginBottom: 28,
                    display: 'flex', gap: 24, flexWrap: 'wrap',
                  }}>
                    <div><span style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: tweaks.accentColor, opacity: 0.7 }}>Servicio</span><p style={{ color: tweaks.bgColor, fontSize: 14, marginTop: 4 }}>{form.service}</p></div>
                    <div><span style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: tweaks.accentColor, opacity: 0.7 }}>Fecha</span><p style={{ color: tweaks.bgColor, fontSize: 14, marginTop: 4 }}>{form.date}</p></div>
                    <div><span style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: tweaks.accentColor, opacity: 0.7 }}>Horario</span><p style={{ color: tweaks.bgColor, fontSize: 14, marginTop: 4 }}>{form.time} hs</p></div>
                  </div>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                    <div>
                      <label style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, display: 'block', marginBottom: 8 }}>Nombre completo *</label>
                      <input type="text" placeholder="Tu nombre"
                        value={form.name}
                        onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                        style={inputStyle}
                        onFocus={e => e.target.style.borderColor = tweaks.accentColor}
                        onBlur={e => e.target.style.borderColor = `${tweaks.navyColor}30`}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, display: 'block', marginBottom: 8 }}>Teléfono *</label>
                      <input type="tel" placeholder="Ej: 11 1234-5678"
                        value={form.phone}
                        onChange={e => setForm(f => ({ ...f, phone: e.target.value }))}
                        style={inputStyle}
                        onFocus={e => e.target.style.borderColor = tweaks.accentColor}
                        onBlur={e => e.target.style.borderColor = `${tweaks.navyColor}30`}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, display: 'block', marginBottom: 8 }}>Notas adicionales</label>
                      <textarea placeholder="Algún detalle sobre tu pelo, preferencias, etc."
                        value={form.notes}
                        onChange={e => setForm(f => ({ ...f, notes: e.target.value }))}
                        rows={3}
                        style={{ ...inputStyle, resize: 'vertical' }}
                        onFocus={e => e.target.style.borderColor = tweaks.accentColor}
                        onBlur={e => e.target.style.borderColor = `${tweaks.navyColor}30`}
                      />
                    </div>
                  </div>

                  <div style={{ marginTop: 32, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                    <button onClick={() => setStep(2)} style={{
                      padding: '14px 28px', background: 'transparent',
                      border: `1px solid ${tweaks.bgColor}30`,
                      color: tweaks.bgColor, fontSize: 13,
                      letterSpacing: '0.08em', textTransform: 'uppercase',
                      cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
                    }}>← Volver</button>
                    <a href={form.name && form.phone ? buildWhatsAppMessage() : '#'}
                      target="_blank" rel="noopener noreferrer"
                      onClick={e => { if (!form.name || !form.phone) e.preventDefault(); }}
                      style={{
                        padding: '14px 32px',
                        background: (form.name && form.phone) ? '#25D366' : '#25D36660',
                        color: '#fff', border: 'none', fontSize: 13,
                        letterSpacing: '0.08em', textTransform: 'uppercase',
                        cursor: (form.name && form.phone) ? 'pointer' : 'not-allowed',
                        fontFamily: 'DM Sans, sans-serif', fontWeight: 500,
                        textDecoration: 'none', display: 'inline-block',
                        transition: 'background 0.2s',
                      }}>
                      <span style={{ marginRight: 8 }}>💬</span>
                      Confirmar por WhatsApp
                    </a>
                  </div>
                </div>
              )}
            </div>
          </div>
        </section>
      );
    }

    // ── HORARIOS ─────────────────────────────────────────────────────
    function HorariosBar({ tweaks }) {
      const schedule = [
        { day: 'Lunes', hours: '9:00 — 16:00' },
        { day: 'Martes', hours: '9:00 — 20:00' },
        { day: 'Miércoles', hours: '9:00 — 20:00' },
        { day: 'Jueves', hours: '9:00 — 20:00' },
        { day: 'Viernes', hours: '9:00 — 20:00' },
        { day: 'Sábado', hours: '10:00 — 18:00' },
        { day: 'Domingo', hours: 'Cerrado' },
      ];
      const today = new Date().getDay();
      const dayMap = [6, 0, 1, 2, 3, 4, 5]; // JS 0=sun => index in schedule

      return (
        <section style={{
          padding: 'clamp(60px,8vh,100px) clamp(24px,8vw,140px)',
          background: tweaks.accentColor + '18',
        }}>
          <div style={{ maxWidth: 860, margin: '0 auto' }}>
            <p style={{
              fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase',
              color: tweaks.accentColor, marginBottom: 16, textAlign: 'center',
            }}>Horarios de atención</p>
            <h2 style={{
              fontFamily: tweaks.headingFont, fontSize: 'clamp(28px,3.5vw,48px)',
              fontWeight: 300, color: tweaks.navyColor, textAlign: 'center', marginBottom: 48,
            }}>Cuando estamos para vos</h2>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 8 }}>
              {schedule.map((s, i) => (
                <div key={i} style={{
                  padding: '20px 12px', textAlign: 'center',
                  background: dayMap[today] === i ? tweaks.navyColor : tweaks.bgColor,
                  border: `1px solid ${tweaks.navyColor}15`,
                  position: 'relative',
                }}>
                  {dayMap[today] === i && (
                    <div style={{
                      position: 'absolute', top: -1, left: 0, right: 0,
                      height: 2, background: tweaks.accentColor,
                    }}></div>
                  )}
                  <p style={{
                    fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase',
                    color: dayMap[today] === i ? tweaks.accentColor : tweaks.navyColor,
                    opacity: dayMap[today] === i ? 1 : 0.5, marginBottom: 8,
                  }}>{s.day}</p>
                  <p style={{
                    fontSize: 12, fontWeight: 500,
                    color: dayMap[today] === i ? tweaks.bgColor : tweaks.navyColor,
                    opacity: s.hours === 'Cerrado' ? 0.35 : 1,
                    lineHeight: 1.4,
                  }}>{s.hours}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ── CONTACTO ─────────────────────────────────────────────────────
    function Contacto({ tweaks }) {
      return (
        <section id="contacto" style={{
          padding: 'clamp(80px,10vh,140px) clamp(24px,8vw,140px)',
          display: 'grid',
          gridTemplateColumns: '1fr 1fr',
          gap: 80,
          alignItems: 'start',
        }}>
          <div>
            <p style={{
              fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase',
              color: tweaks.accentColor, marginBottom: 16,
            }}>Encontranos</p>
            <h2 style={{
              fontFamily: tweaks.headingFont,
              fontSize: 'clamp(32px,4vw,56px)',
              fontWeight: 300, color: tweaks.navyColor,
              lineHeight: 1.15, marginBottom: 40,
            }}>Juncal 2069,<br /><em>Recoleta</em></h2>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
              <ContactItem icon="📍" label="Dirección" value="Juncal 2069, Recoleta, CABA" tweaks={tweaks} />
              <ContactItem icon="📞" label="Teléfono" value="011 2241-8941" href="tel:+5491122418941" tweaks={tweaks} />
              <ContactItem icon="💬" label="WhatsApp" value="Escribinos directo" href="https://wa.me/5491122418941" tweaks={tweaks} />
            </div>

            {tweaks.showLGBTQ && (
              <div style={{
                marginTop: 40, padding: '16px 20px',
                border: `1px solid ${tweaks.accentColor}40`,
                display: 'inline-flex', gap: 10, alignItems: 'center',
              }}>
                <span style={{ fontSize: 18 }}>🏳️‍🌈</span>
                <div>
                  <p style={{ fontSize: 12, fontWeight: 500, color: tweaks.navyColor }}>Espacio seguro</p>
                  <p style={{ fontSize: 11, opacity: 0.5, color: tweaks.navyColor }}>Amigable con LGBTQ+ · Personas trans bienvenides</p>
                </div>
              </div>
            )}
          </div>

          {/* Map embed placeholder */}
          <div style={{
            background: `${tweaks.navyColor}08`,
            border: `1px solid ${tweaks.navyColor}12`,
            aspectRatio: '1',
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center',
            gap: 12, position: 'relative', overflow: 'hidden',
          }}>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.0!2d-58.39!3d-34.58!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcca9a3e6b89d7%3A0x0!2sJuncal%202069%2C%20Buenos%20Aires!5e0!3m2!1ses!2sar!4v1234567890"
              width="100%" height="100%"
              style={{ border: 0, display: 'block' }}
              allowFullScreen=""
              loading="lazy"
              title="Casa Luciano en el mapa"
            ></iframe>
          </div>
        </section>
      );
    }

    function ContactItem({ icon, label, value, href, tweaks }) {
      const content = (
        <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
          <span style={{ fontSize: 18, opacity: 0.7, marginTop: 2 }}>{icon}</span>
          <div>
            <p style={{ fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, opacity: 0.8, marginBottom: 4 }}>{label}</p>
            <p style={{ fontSize: 15, color: tweaks.navyColor, fontWeight: 400 }}>{value}</p>
          </div>
        </div>
      );
      if (href) return <a href={href} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none', display: 'block' }}>{content}</a>;
      return <div>{content}</div>;
    }

    // ── FOOTER ───────────────────────────────────────────────────────
    function Footer({ tweaks }) {
      return (
        <footer style={{
          padding: '40px clamp(24px,8vw,140px)',
          background: tweaks.navyColor,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          flexWrap: 'wrap', gap: 16,
        }}>
          <div>
            <p style={{ fontFamily: tweaks.headingFont, fontSize: 20, color: tweaks.bgColor, fontWeight: 400, letterSpacing: '0.02em' }}>Casa Luciano</p>
            <p style={{ fontSize: 12, color: tweaks.bgColor, opacity: 0.4, marginTop: 4 }}>Estética integral unisex · Recoleta, Buenos Aires</p>
          </div>
          <div style={{ display: 'flex', gap: 24, alignItems: 'center' }}>
            <a href="https://wa.me/5491122418941" target="_blank" rel="noopener noreferrer"
              style={{ fontSize: 12, color: tweaks.bgColor, opacity: 0.5, textDecoration: 'none', letterSpacing: '0.06em', transition: 'opacity 0.2s' }}
              onMouseEnter={e => e.target.style.opacity = 1}
              onMouseLeave={e => e.target.style.opacity = 0.5}
            >WhatsApp</a>
            <a href="tel:+5491122418941"
              style={{ fontSize: 12, color: tweaks.bgColor, opacity: 0.5, textDecoration: 'none', letterSpacing: '0.06em', transition: 'opacity 0.2s' }}
              onMouseEnter={e => e.target.style.opacity = 1}
              onMouseLeave={e => e.target.style.opacity = 0.5}
            >Llamar</a>
            <a href="#turnos"
              style={{ padding: '10px 20px', background: tweaks.accentColor, color: tweaks.navyColor, fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', textDecoration: 'none', fontWeight: 500 }}>
              Turno
            </a>
          </div>
        </footer>
      );
    }

    // ── TWEAKS PANEL ─────────────────────────────────────────────────
    function AppTweaks({ tweaks, setTweak }) {
      return (
        <TweaksPanel>
          <TweakSection label="Colores" />
          <TweakColor label="Navy (principal)" value={tweaks.navyColor} onChange={v => setTweak('navyColor', v)} />
          <TweakColor label="Acento durazno" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
          <TweakColor label="Fondo crema" value={tweaks.bgColor} onChange={v => setTweak('bgColor', v)} />
          <TweakSection label="Contenido" />
          <TweakText label="Tagline hero" value={tweaks.heroTagline} onChange={v => setTweak('heroTagline', v)} />
          <TweakToggle label="Mostrar badge LGBTQ+" value={tweaks.showLGBTQ} onChange={v => setTweak('showLGBTQ', v)} />
          <TweakSection label="Tipografía" />
          <TweakSelect label="Fuente de títulos" value={tweaks.headingFont}
            options={['Cormorant Garamond','Playfair Display','Libre Baskerville','Georgia']}
            onChange={v => setTweak('headingFont', v)} />
        </TweaksPanel>
      );
    }

    // ── APP ──────────────────────────────────────────────────────────
    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      return (
        <div style={{ background: tweaks.bgColor, minHeight: '100vh' }}>
          <style>{`
            @keyframes scrollLine {
              0% { transform: scaleY(0); transform-origin: top; }
              50% { transform: scaleY(1); transform-origin: top; }
              51% { transform: scaleY(1); transform-origin: bottom; }
              100% { transform: scaleY(0); transform-origin: bottom; }
            }
            input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
          `}</style>

          <Nav tweaks={tweaks} />
          <Hero tweaks={tweaks} />
          <Servicios tweaks={tweaks} />
          <Galeria tweaks={tweaks} />
          <Resenas tweaks={tweaks} />
          <HorariosBar tweaks={tweaks} />
          <Turnos tweaks={tweaks} />
          <Contacto tweaks={tweaks} />
          <Footer tweaks={tweaks} />

          <AppTweaks tweaks={tweaks} setTweak={setTweak} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
